name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fpe-mod
          path: build/libs/*.jar
      # always-current download: Releases -> "Latest build" -> fpe-1.0.0.jar (copy into the Windows mods folder)
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build" --notes "Auto-built from main. Put the .jar into .minecraft/mods (Minecraft 1.20.1, Forge 47.3.0)."
